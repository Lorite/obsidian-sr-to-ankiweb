[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-sr-to-ankiweb"
version = "0.1.0"
description = "One-way, headless sync of Obsidian spaced-repetition flashcards to Anki and AnkiWeb"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["anki>=25.9", "markdown>=3.5", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sr-anki-sync = "sr_anki_sync:main"

[project.urls]
Homepage = "https://github.com/Lorite/obsidian-sr-to-ankiweb"

[tool.setuptools]
py-modules = ["sr_anki_sync"]
